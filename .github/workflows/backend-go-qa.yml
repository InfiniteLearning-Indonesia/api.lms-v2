name: Backend Go bootstrap QA (not release approval)

on:
  push:
    branches: [be-v3]
  pull_request:
    branches: [be-v3]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-go-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned synthetic QA dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r qa/requirements.lock
      - name: M03 bootstrap and M00/M01 predicate regression
        # Cache location matches the isolated runner. Download verifies go.sum.
        # No staging env file or credential is provided to this job.
        run: |
          go mod download
          .venv/bin/python -m qa.run --package M03 --profile local-synthetic --checks-only
        env:
          GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
      - name: Go race detector (Linux compiler)
        env:
          GOTOOLCHAIN: go1.27.1
          GOPROXY: 'off'
          GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
        run: go test -race -count=1 ./...
      - name: Retain bounded public bootstrap diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bootstrap-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/../../lms-v3-qa-artifacts/*-M03-*/ci-diagnostic.json
          if-no-files-found: warn
          retention-days: 3
          compression-level: 9
      - name: Static non-root artifact (build only, no publish)
        run: .venv/bin/python -m qa.release
      # No production/staging secrets, DB services, import, deployment, write
      # token, report auto-commit, or raw artifact upload. Only the bounded
      # allowlisted ci-diagnostic.json projection is uploaded for three days.
      # Missing diagnostic after preflight refusal is not a successful QA run.
      # A green bootstrap job
      # is NOT BACKEND_VERIFIED and does not satisfy M00 environment checks.

  fresh-postgres-backend:
    runs-on: ubuntu-24.04
    needs: synthetic-checks
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned QA dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r qa/requirements.lock
      - name: Download checksum-verified Go dependencies for this fresh job
        run: go mod download
        env:
          GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
      - name: Install explicit PostgreSQL 18.6 tools (CI machine only)
        # Official PGDG package setup: https://www.postgresql.org/download/linux/ubuntu/
        # Upstream minor is explicit; record the selected signed package revision.
        # Failure to obtain that version stops instead of using runner defaults.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-common ca-certificates
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          echo 'create_main_cluster = false' | sudo tee /etc/postgresql-common/createcluster.conf > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends 'postgresql-18=18.6-*' 'postgresql-client-18=18.6-*'
          /usr/lib/postgresql/18/bin/postgres --version
          /usr/lib/postgresql/18/bin/pg_dump --version
          dpkg-query -W postgresql-18 postgresql-client-18
      - name: Fresh loopback PostgreSQL, backup/restore and backend dependency journey through M14-CP04
        run: .venv/bin/python -m qa.postgres_lab --create-local-synthetic-cluster --pg-bin /usr/lib/postgresql/18/bin --reporting-performance-journey
        env:
          GOTOOLCHAIN: go1.27.1
          GOPROXY: 'off'
          GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
          GOCACHE: ${{ github.workspace }}/.cache/go-build
      # The harness accepts no DSN/env file and creates a fresh loopback cluster.
      # This job has no staging/live credentials, artifact upload, deploy, or
      # shared migration authority. A workflow definition is not execution proof.
